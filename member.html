<!doctype html>
<html lang="zh-Hant" data-demo-role="customer" data-protected="true" data-login-page="./login.html">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>1-1｜會員展示</title>
  <link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./demo-auth.css">
  <script src="./demo-access.js" defer></script>
</head>
<body>
  <div data-demo-content hidden>
    <header class="top"><div class="frame top-inner">
      <a class="brand" href="./"><strong>1-1</strong><span>會員中心</span></a>
      <nav aria-label="會員導覽"><a href="./#plans">貸款方案</a><a href="#cases">我的案件</a></nav>
      <button class="button small" type="button" data-demo-logout>登出</button>
    </div></header>
    <main class="frame member-preview">
      <p class="demo-note">會員展示 · 以下為虛構資料</p>
      <h1>會員首頁</h1>
      <section class="member-example" id="cases">
        <h2>最近申請</h2>
        <dl>
          <div><dt>申請方案</dt><dd>小額週轉</dd></div>
          <div><dt>案件編號</dt><dd>DEMO-001</dd></div>
          <div><dt>示範金額</dt><dd>NT$ 100,000</dd></div>
          <div><dt>申請狀態</dt><dd>審核中</dd></div>
        </dl>
        <details><summary>消息與進度</summary><p>展示案件已收件，目前示範狀態為審核中。</p></details>
      </section>
      <a class="button" href="./#plans">返回方案與申請預覽</a>
    </main>
  </div>
  <noscript>請啟用 JavaScript 以使用會員展示。</noscript>
</body>
</html>
